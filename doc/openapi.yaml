---
openapi: 3.2.0
info:
  title: Socially Restless API
  version: 1.0.0
  description: 'A RESTful API for a social media application: user accounts, posts,
    ratings, and an activity timeline.'
servers:
- url: http://localhost:3000
  description: Local development
paths:
  "/api/v1/posts":
    post:
      summary: create
      tags:
      - Api::V1::Post
      responses:
        '201':
          description: ignores a client-supplied user_id and always attributes the
            post to the current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    type: object
                    properties:
                      id:
                        type: integer
                      title:
                        type: string
                      body:
                        type: string
                      user_id:
                        type: integer
                      view_count:
                        type: integer
                      average_rating:
                        type: number
                        format: float
                      ratings_count:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - title
                    - body
                    - user_id
                    - view_count
                    - average_rating
                    - ratings_count
                    - created_at
                    - updated_at
                required:
                - post
              example:
                post:
                  id: 12204
                  title: Hello
                  body: Body
                  user_id: 16066
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  created_at: '2026-08-31T18:56:41.009Z'
                  updated_at: '2026-08-31T18:56:41.009Z'
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Unauthorized
                  details: []
        '422':
          description: returns a validation error for a body over 1000 characters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Validation failed
                  details:
                  - Body is too long (maximum is 1000 characters)
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer 52120a11adf37f16a77e2ea136c9044198dc0a013fce666fa4e048cfb66b01b7
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                post:
                  type: object
                  properties:
                    title:
                      type: string
                    body:
                      type: string
                    user_id:
                      type: string
                  required:
                  - title
                  - body
              required:
              - post
            example:
              post:
                title: Hello
                body: Body
                user_id: '16065'
  "/api/v1/posts/{id}":
    delete:
      summary: destroy
      tags:
      - Api::V1::Post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer 7245ec98cae00a0c4f921e3ab204345da943173f452ba9026f047ebe459a4ee6
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 0
      responses:
        '204':
          description: soft deletes the post without removing the row
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Unauthorized
                  details: []
        '404':
          description: 404s for a nonexistent post
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Post not found
                  details: []
    get:
      summary: show
      tags:
      - Api::V1::Post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer b0df1479a582b7dae69a59a51bf04344b0eb378b2a5b58a5c69698b40a26ce38
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 12202
      responses:
        '200':
          description: does not increment view_count when the author views their own
            post
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    type: object
                    properties:
                      id:
                        type: integer
                      title:
                        type: string
                      body:
                        type: string
                      user_id:
                        type: integer
                      view_count:
                        type: integer
                      average_rating:
                        type: number
                        format: float
                      ratings_count:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - title
                    - body
                    - user_id
                    - view_count
                    - average_rating
                    - ratings_count
                    - created_at
                    - updated_at
                required:
                - post
              example:
                post:
                  id: 12202
                  title: Neque non qui nisi.
                  body: Quam autem nam. Ducimus qui perferendis. Mollitia ratione
                    cum.
                  user_id: 16063
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  created_at: '2026-08-31T18:56:40.985Z'
                  updated_at: '2026-08-31T18:56:40.985Z'
        '404':
          description: 404s for a nonexistent post
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Post not found
                  details: []
  "/api/v1/posts/{post_id}/rating":
    post:
      summary: create
      tags:
      - Api::V1::Rating
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer d494989fbf5c8f4e5ab14dacc23f2ff2b5e7b564d42a3d39abf3030ffc1fd738
      - name: post_id
        in: path
        required: true
        schema:
          type: integer
        example: 12215
      responses:
        '200':
          description: updates the existing rating in place on a second call, without
            creating a duplicate
          content:
            application/json:
              schema:
                type: object
                properties:
                  rating:
                    type: object
                    properties:
                      id:
                        type: integer
                      post_id:
                        type: integer
                      user_id:
                        type: integer
                      score:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - post_id
                    - user_id
                    - score
                    - created_at
                    - updated_at
                required:
                - rating
              example:
                rating:
                  id: 2257
                  post_id: 12211
                  user_id: 16089
                  score: 5
                  created_at: '2026-08-31T18:56:41.432Z'
                  updated_at: '2026-08-31T18:56:41.438Z'
        '201':
          description: lets different users rate the same post independently
          content:
            application/json:
              schema:
                type: object
                properties:
                  rating:
                    type: object
                    properties:
                      id:
                        type: integer
                      post_id:
                        type: integer
                      user_id:
                        type: integer
                      score:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - post_id
                    - user_id
                    - score
                    - created_at
                    - updated_at
                required:
                - rating
              example:
                rating:
                  id: 2259
                  post_id: 12212
                  user_id: 16090
                  score: 5
                  created_at: '2026-08-31T18:56:41.464Z'
                  updated_at: '2026-08-31T18:56:41.464Z'
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Unauthorized
                  details: []
        '404':
          description: 404s for a soft-deleted post
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Post not found
                  details: []
        '422':
          description: rejects a missing score
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Validation failed
                  details:
                  - Score can't be blank
                  - Score is not included in the list
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                rating:
                  type: object
                  properties:
                    score:
                      type: string
                  required:
                  - score
              required:
              - rating
            example:
              rating:
                score: '5'
  "/api/v1/session":
    delete:
      summary: destroy
      tags:
      - Api::V1::Session
      responses:
        '204':
          description: revokes the session so the token can no longer authenticate
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer d6c0aeba1997b1cca82fee2d23295f43eb302f6356e138959e902b2303e0ff34
    post:
      summary: create
      tags:
      - Api::V1::Session
      responses:
        '200':
          description: logs in with mismatched email casing
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      email:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      created_at:
                        type: string
                    required:
                    - id
                    - username
                    - email
                    - first_name
                    - last_name
                    - created_at
                  token:
                    type: string
                required:
                - user
                - token
              example:
                user:
                  id: 16101
                  username: user146
                  email: user146@example.com
                  first_name: My
                  last_name: Kassulke
                  created_at: '2026-08-31T18:56:41.529Z'
                token: 1394990f7dc75e93945774f3be2e246e15d2019a34b7f3b650497f1d86c21c40
        '401':
          description: rejects an unknown email
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Invalid email or password
                  details: []
        '429':
          description: returns the standard error envelope and a Retry-After header
            when throttled
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Rate limit exceeded. Try again later.
                  details: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                session:
                  type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                  required:
                  - email
                  - password
              required:
              - session
            example:
              session:
                email: USER146@EXAMPLE.COM
                password: password123
  "/api/v1/timeline":
    get:
      summary: index
      tags:
      - Api::V1::Timeline
      responses:
        '200':
          description: re-queries once the cache entry actually expires in Redis
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        body:
                          type: string
                        user_id:
                          type: integer
                        view_count:
                          type: integer
                        average_rating:
                          type: number
                          format: float
                        ratings_count:
                          type: integer
                        created_at:
                          type: string
                        updated_at:
                          type: string
                        author:
                          type: object
                          properties:
                            id:
                              type: integer
                            username:
                              type: string
                            email:
                              type: string
                            first_name:
                              type: string
                            last_name:
                              type: string
                            created_at:
                              type: string
                          required:
                          - id
                          - username
                          - email
                          - first_name
                          - last_name
                          - created_at
                      required:
                      - id
                      - title
                      - body
                      - user_id
                      - view_count
                      - average_rating
                      - ratings_count
                      - created_at
                      - updated_at
                      - author
                  meta:
                    type: object
                    properties:
                      per_page:
                        type: integer
                      has_more:
                        type: boolean
                      next_cursor:
                        type:
                        - string
                        - 'null'
                    required:
                    - per_page
                    - has_more
                    - next_cursor
                required:
                - posts
                - meta
              example:
                posts:
                - id: 12291
                  title: Rem quis qui et.
                  body: Magni incidunt et. Sunt magni molestiae. Facilis quis eligendi.
                  user_id: 16187
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  created_at: '2026-08-31T18:56:42.180Z'
                  updated_at: '2026-08-31T18:56:42.180Z'
                  author:
                    id: 16187
                    username: user229
                    email: user232@example.com
                    first_name: Lionel
                    last_name: Kerluke
                    created_at: '2026-08-31T18:56:42.178Z'
                - id: 12290
                  title: Officia incidunt qui et.
                  body: Rerum adipisci sint. Dolor iusto deserunt. Voluptatem ducimus
                    in.
                  user_id: 16186
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  created_at: '2026-08-31T18:56:42.066Z'
                  updated_at: '2026-08-31T18:56:42.066Z'
                  author:
                    id: 16186
                    username: user228
                    email: user231@example.com
                    first_name: Ena
                    last_name: Fay
                    created_at: '2026-08-31T18:56:42.065Z'
                meta:
                  per_page: 10
                  has_more: false
                  next_cursor:
        '400':
          description: returns a 400 for a malformed cursor instead of silently restarting
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: invalid pagination cursor
                  details: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        example: MjAyNi0wOC0zMVQxODo1Njo0MS45OTc2MzBafDEyMjg0
      - name: min_rating
        in: query
        required: false
        schema:
          oneOf:
          - type: integer
          - type: string
        example: 4
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        example: 2
  "/api/v1/users":
    post:
      summary: create
      tags:
      - Api::V1::User
      responses:
        '201':
          description: creates a user without a first or last name
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      email:
                        type: string
                      first_name:
                        type:
                        - string
                        - 'null'
                      last_name:
                        type:
                        - string
                        - 'null'
                      created_at:
                        type: string
                    required:
                    - id
                    - username
                    - email
                    - first_name
                    - last_name
                    - created_at
                  token:
                    type: string
                required:
                - user
                - token
              example:
                user:
                  id: 16201
                  username: newuser
                  email: newuser@example.com
                  first_name:
                  last_name:
                  created_at: '2026-08-31T18:56:42.372Z'
                token: 1ae6241ecb6be5073d62c832fcaa6401296af2ff72324098c852834664ed8499
        '422':
          description: rejects duplicate emails case-insensitively
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Validation failed
                  details:
                  - Email has already been taken
        '429':
          description: throttles after 5 signups from the same IP within a minute
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Rate limit exceeded. Try again later.
                  details: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    username:
                      type: string
                    email:
                      type: string
                    password:
                      type: string
                    password_confirmation:
                      type: string
                    first_name:
                      type: string
                    last_name:
                      type: string
                  required:
                  - username
                  - email
                  - password
                  - password_confirmation
              required:
              - user
            example:
              user:
                username: newuser
                email: newuser@example.com
                password: password123
                password_confirmation: password123
                first_name: Jane
                last_name: Doe
  "/api/v1/users/{user_username}/posts":
    get:
      summary: index
      tags:
      - Api::V1::Users::Post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer aaa44b633fcb06bc34308df8a04d571a47dc95a86b8b0e15f6f383a2f310a7ba
      - name: page
        in: query
        required: false
        schema:
          oneOf:
          - type: integer
          - type: string
        example: not-a-number
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        example: -5
      - name: user_username
        in: path
        required: true
        schema:
          type: string
        example: alice
      responses:
        '200':
          description: does not increment view_count when the profile's own user is
            viewing
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        body:
                          type: string
                        user_id:
                          type: integer
                        view_count:
                          type: integer
                        average_rating:
                          type: number
                          format: float
                        ratings_count:
                          type: integer
                        created_at:
                          type: string
                        updated_at:
                          type: string
                      required:
                      - id
                      - title
                      - body
                      - user_id
                      - view_count
                      - average_rating
                      - ratings_count
                      - created_at
                      - updated_at
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
                      total_pages:
                        type: integer
                    required:
                    - page
                    - per_page
                    - total_count
                    - total_pages
                required:
                - posts
                - meta
              example:
                posts:
                - id: 12333
                  title: Omnis alias dolor tempore.
                  body: Molestias corporis soluta. Minus non odit. Assumenda eos qui.
                  user_id: 16199
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  created_at: '2026-08-31T18:56:42.349Z'
                  updated_at: '2026-08-31T18:56:42.349Z'
                - id: 12332
                  title: Quasi reprehenderit sint sint.
                  body: Porro ratione et. Mollitia quia reprehenderit. Voluptatem
                    perspiciatis deleniti.
                  user_id: 16199
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  created_at: '2026-08-31T18:56:42.347Z'
                  updated_at: '2026-08-31T18:56:42.347Z'
                meta:
                  page: 1
                  per_page: 10
                  total_count: 2
                  total_pages: 1
  "/health":
    get:
      summary: show
      tags:
      - Health
      responses:
        '200':
          description: is not one of the pass/fail subsystem checks
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  checked_at:
                    type: string
                  subsystems:
                    type: object
                    properties:
                      database:
                        type: object
                        properties:
                          status:
                            type: string
                          critical:
                            type: boolean
                          latency_ms:
                            type: number
                            format: float
                        required:
                        - status
                        - critical
                        - latency_ms
                      cache:
                        type: object
                        properties:
                          status:
                            type: string
                          critical:
                            type: boolean
                          latency_ms:
                            type: number
                            format: float
                          error:
                            type: string
                        required:
                        - status
                        - critical
                      rate_limiter:
                        type: object
                        properties:
                          status:
                            type: string
                          critical:
                            type: boolean
                          latency_ms:
                            type: number
                            format: float
                          error:
                            type: string
                        required:
                        - status
                        - critical
                    required:
                    - database
                    - cache
                    - rate_limiter
                  latest_commit:
                    type:
                    - string
                    - 'null'
                required:
                - status
                - checked_at
                - subsystems
              example:
                status: ok
                checked_at: '2026-08-31T18:56:42Z'
                subsystems:
                  database:
                    status: ok
                    critical: true
                    latency_ms: 0.12
                  cache:
                    status: ok
                    critical: false
