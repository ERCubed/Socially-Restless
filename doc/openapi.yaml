  "/api/v1/users":
    post:
      summary: create
      tags:
      - Api::V1::User
      responses:
        '201':
          description: creates a user without a first or last name
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      email:
                        type: string
                      first_name:
                        type:
                        - string
                        - 'null'
                      last_name:
                        type:
                        - string
                        - 'null'
                      created_at:
                        type: string
                    required:
                    - id
                    - username
                    - email
                    - first_name
                    - last_name
                    - created_at
                  token:
                    type: string
                required:
                - user
                - token
              example:
                user:
                  id: 1549
                  username: newuser
                  email: newuser@example.com
                  first_name:
                  last_name:
                  created_at: '2026-08-31T20:51:38.167Z'
                token: f29cf25759089eb4877c0a2315bcc97a419203aae85fb144d09b7ff06597e039
        '422':
          description: rejects duplicate emails case-insensitively
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Validation failed
                  details:
                  - Email has already been taken
        '429':
          description: throttles after 5 signups from the same IP within a minute
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Rate limit exceeded. Try again later.
                  details: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    username:
                      type: string
                    email:
                      type: string
                    password:
                      type: string
                    password_confirmation:
                      type: string
                    first_name:
                      type: string
                    last_name:
                      type: string
                  required:
                  - username
                  - email
                  - password
                  - password_confirmation
              required:
              - user
            example:
              user:
                username: newuser
                email: newuser@example.com
                password: password123
                password_confirmation: password123
                first_name: Jane
                last_name: Doe
