                username: newuser
                email: newuser@example.com
                password: password123
                password_confirmation: password123
                first_name: Jane
                last_name: Doe
  "/api/v1/users/{user_username}/posts":
    get:
      summary: index
      tags:
      - Api::V1::Users::Post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer 57de1de4495d07f93531fe9e2422d7fb8fd769fd6e341e17bde22d01c8e14a02
      - name: page
        in: query
        required: false
        schema:
          oneOf:
          - type: integer
          - type: string
        example: not-a-number
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        example: -5
      - name: user_username
        in: path
        required: true
        schema:
          type: string
        example: alice
