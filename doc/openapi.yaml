---
openapi: 3.2.0
info:
  title: Socially Restless API
  version: 1.0.0
  description: 'A RESTful API for a social media application: user accounts, posts,
    ratings, and an activity timeline.'
servers:
- url: http://localhost:3000
  description: Local development
paths:
  "/api/v1/posts":
    post:
      summary: create
      tags:
      - Api::V1::Post
      responses:
        '201':
          description: ignores a client-supplied user_id and always attributes the
            post to the current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    type: object
                    properties:
                      id:
                        type: integer
                      title:
                        type: string
                      body:
                        type: string
                      user_id:
                        type: integer
                      view_count:
                        type: integer
                      average_rating:
                        type: number
                        format: float
                      ratings_count:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      lock_version:
                        type: integer
                    required:
                    - id
                    - title
                    - body
                    - user_id
                    - view_count
                    - average_rating
                    - ratings_count
                    - created_at
                    - updated_at
                required:
                - post
              example:
                post:
                  id: 1917
                  title: Hello
                  body: Body
                  user_id: 2554
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  created_at: '2026-08-31T19:31:13.715Z'
                  updated_at: '2026-08-31T19:31:13.715Z'
                  lock_version: 0
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Unauthorized
                  details: []
        '422':
          description: returns a validation error for a body over 1000 characters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Validation failed
                  details:
                  - Body is too long (maximum is 1000 characters)
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer bfe12bc8328473938edc8a3cf0dd2393b6010a989269fcded09e5370bbed9efd
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                post:
                  type: object
                  properties:
                    title:
                      type: string
                    body:
                      type: string
                    user_id:
                      type: string
                  required:
                  - title
                  - body
              required:
              - post
            example:
              post:
                title: Hello
                body: Body
                user_id: '2553'
  "/api/v1/posts/{id}":
    delete:
      summary: destroy
      tags:
      - Api::V1::Post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer 1d6929250133eb9d7ff5e58943e104cfab6d18491570b39a3c9cf0f4087b38e2
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 0
      responses:
        '204':
          description: soft deletes the post without removing the row
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Unauthorized
                  details: []
        '404':
          description: 404s for a nonexistent post
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Post not found
                  details: []
    get:
      summary: show
      tags:
      - Api::V1::Post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer 3b28d0e9a25f5d1528880537cda743f3e3a43939104943fdfbe90ac45cd433b9
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 1915
      responses:
        '200':
          description: does not increment view_count when the author views their own
            post
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    type: object
                    properties:
                      id:
                        type: integer
                      title:
                        type: string
                      body:
                        type: string
                      user_id:
                        type: integer
                      view_count:
                        type: integer
                      average_rating:
                        type: number
                        format: float
                      ratings_count:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      lock_version:
                        type: integer
                    required:
                    - id
                    - title
                    - body
                    - user_id
                    - view_count
                    - average_rating
                    - ratings_count
                    - created_at
                    - updated_at
                required:
                - post
              example:
                post:
                  id: 1915
                  title: Ipsam voluptates eaque et.
                  body: Quia et rerum. Accusamus omnis debitis. Quas dolor ratione.
                  user_id: 2551
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  created_at: '2026-08-31T19:31:13.687Z'
                  updated_at: '2026-08-31T19:31:13.687Z'
                  lock_version: 0
        '404':
          description: 404s for a nonexistent post
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Post not found
                  details: []
    patch:
      summary: update
      tags:
      - Api::V1::Post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer 86c9799690efdf6f0eeeea8fd7f3e0bbbdf264eee8c190a5adc3a26659884464
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 0
      responses:
        '200':
          description: ignores a client-supplied user_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    type: object
                    properties:
                      id:
                        type: integer
                      title:
                        type: string
                      body:
                        type: string
                      user_id:
                        type: integer
                      view_count:
                        type: integer
                      average_rating:
                        type: number
                        format: float
                      ratings_count:
                        type: integer
                      lock_version:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - title
                    - body
                    - user_id
                    - view_count
                    - average_rating
                    - ratings_count
                    - lock_version
                    - created_at
                    - updated_at
                required:
                - post
              example:
                post:
                  id: 1922
                  title: New
                  body: Original body
                  user_id: 2563
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  lock_version: 1
                  created_at: '2026-08-31T19:31:13.783Z'
                  updated_at: '2026-08-31T19:31:13.787Z'
        '400':
          description: requires lock_version to be present
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: 'param is missing or the value is empty or invalid: lock_version'
                  details: []
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Unauthorized
                  details: []
        '404':
          description: 404s for a nonexistent post
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Post not found
                  details: []
        '409':
          description: rejects a stale lock_version with 409, and does not apply the
            update
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: This record was updated by someone else since you last
                    loaded it. Reload and try again.
                  details: []
        '422':
          description: returns a validation error for a title over 100 characters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Validation failed
                  details:
                  - Title is too long (maximum is 100 characters)
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                post:
                  type: object
                  properties:
                    title:
                      type: string
                    body:
                      type: string
                    lock_version:
                      type: string
                    user_id:
                      type: string
                  required:
                  - title
                  - lock_version
              required:
              - post
            example:
              post:
                title: New
                body: Updated body
                lock_version: '0'
                user_id: '2562'
  "/api/v1/posts/{post_id}/rating":
    post:
      summary: create
      tags:
      - Api::V1::Rating
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer 3d670c2153886d05a164e3bc1475e04637051b2fbfefdfcd1e410abace3ea714
      - name: post_id
        in: path
        required: true
        schema:
          type: integer
        example: 1936
      responses:
        '200':
          description: updates the existing rating in place on a second call, without
            creating a duplicate
          content:
            application/json:
              schema:
                type: object
                properties:
                  rating:
                    type: object
                    properties:
                      id:
                        type: integer
                      post_id:
                        type: integer
                      user_id:
                        type: integer
                      score:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - post_id
                    - user_id
                    - score
                    - created_at
                    - updated_at
                required:
                - rating
              example:
                rating:
                  id: 342
                  post_id: 1932
                  user_id: 2588
                  score: 5
                  created_at: '2026-08-31T19:31:14.200Z'
                  updated_at: '2026-08-31T19:31:14.206Z'
        '201':
          description: lets different users rate the same post independently
          content:
            application/json:
              schema:
                type: object
                properties:
                  rating:
                    type: object
                    properties:
                      id:
                        type: integer
                      post_id:
                        type: integer
                      user_id:
                        type: integer
                      score:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - post_id
                    - user_id
                    - score
                    - created_at
                    - updated_at
                required:
                - rating
              example:
                rating:
                  id: 344
                  post_id: 1933
                  user_id: 2589
                  score: 5
                  created_at: '2026-08-31T19:31:14.234Z'
                  updated_at: '2026-08-31T19:31:14.234Z'
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Unauthorized
                  details: []
        '404':
          description: 404s for a soft-deleted post
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Post not found
                  details: []
        '422':
          description: rejects a missing score
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Validation failed
                  details:
                  - Score can't be blank
                  - Score is not included in the list
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                rating:
                  type: object
                  properties:
                    score:
                      type: string
                  required:
                  - score
              required:
              - rating
            example:
              rating:
                score: '5'
  "/api/v1/session":
    delete:
      summary: destroy
      tags:
      - Api::V1::Session
      responses:
        '204':
          description: revokes the session so the token can no longer authenticate
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer f354be98ffc183f19caaf7b5fcf81f286286878d234917b4f0cde2135880395f
    post:
      summary: create
      tags:
      - Api::V1::Session
      responses:
        '200':
          description: logs in with mismatched email casing
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      email:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      created_at:
                        type: string
                    required:
                    - id
                    - username
                    - email
                    - first_name
                    - last_name
                    - created_at
                  token:
                    type: string
                required:
                - user
                - token
              example:
                user:
                  id: 2600
                  username: user157
                  email: user157@example.com
                  first_name: Karolyn
                  last_name: Cummings
                  created_at: '2026-08-31T19:31:14.301Z'
                token: d239ce0d96b21052989beda653c6220fc737e08c9382ce554ed770d3dba81e82
        '401':
          description: rejects an unknown email
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Invalid email or password
                  details: []
        '429':
          description: returns the standard error envelope and a Retry-After header
            when throttled
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Rate limit exceeded. Try again later.
                  details: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                session:
                  type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                  required:
                  - email
                  - password
              required:
              - session
            example:
              session:
                email: USER157@EXAMPLE.COM
                password: password123
  "/api/v1/timeline":
    get:
      summary: index
      tags:
      - Api::V1::Timeline
      responses:
        '200':
          description: re-queries once the cache entry actually expires in Redis
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        body:
                          type: string
                        user_id:
                          type: integer
                        view_count:
                          type: integer
                        average_rating:
                          type: number
                          format: float
                        ratings_count:
                          type: integer
                        created_at:
                          type: string
                        updated_at:
                          type: string
                        author:
                          type: object
                          properties:
                            id:
                              type: integer
                            username:
                              type: string
                            email:
                              type: string
                            first_name:
                              type: string
                            last_name:
                              type: string
                            created_at:
                              type: string
                          required:
                          - id
                          - username
                          - email
                          - first_name
                          - last_name
                          - created_at
                        lock_version:
                          type: integer
                      required:
                      - id
                      - title
                      - body
                      - user_id
                      - view_count
                      - average_rating
                      - ratings_count
                      - created_at
                      - updated_at
                      - author
                  meta:
                    type: object
                    properties:
                      per_page:
                        type: integer
                      has_more:
                        type: boolean
                      next_cursor:
                        type:
                        - string
                        - 'null'
                    required:
                    - per_page
                    - has_more
                    - next_cursor
                required:
                - posts
                - meta
              example:
                posts:
                - id: 2012
                  title: Odio cum similique voluptate.
                  body: Sint reiciendis fugit. Unde omnis facere. Impedit alias officiis.
                  user_id: 2686
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  lock_version: 0
                  created_at: '2026-08-31T19:31:14.934Z'
                  updated_at: '2026-08-31T19:31:14.934Z'
                  author:
                    id: 2686
                    username: user240
                    email: user243@example.com
                    first_name: Nancey
                    last_name: Roberts
                    created_at: '2026-08-31T19:31:14.932Z'
                - id: 2011
                  title: Sint tenetur blanditiis dolorem.
                  body: Mollitia consequatur est. Quisquam reprehenderit non. Minus
                    voluptatem ipsa.
                  user_id: 2685
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  lock_version: 0
                  created_at: '2026-08-31T19:31:14.821Z'
                  updated_at: '2026-08-31T19:31:14.821Z'
                  author:
                    id: 2685
                    username: user239
                    email: user242@example.com
                    first_name: Donn
                    last_name: Lueilwitz
                    created_at: '2026-08-31T19:31:14.820Z'
                meta:
                  per_page: 10
                  has_more: false
                  next_cursor:
        '400':
          description: returns a 400 for a malformed cursor instead of silently restarting
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: invalid pagination cursor
                  details: []
        '503':
          description: returns a 503 with the standard error envelope instead of a
            raw 500
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: The server is temporarily overloaded. Please try again
                    shortly.
                  details: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        example: MjAyNi0wOC0zMVQxOTozMToxNC43NTg3MjBafDIwMDU=
      - name: min_rating
        in: query
        required: false
        schema:
          oneOf:
          - type: integer
          - type: string
        example: 4
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        example: 2
  "/api/v1/users":
    post:
      summary: create
      tags:
      - Api::V1::User
      responses:
        '201':
          description: creates a user without a first or last name
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      email:
                        type: string
                      first_name:
                        type:
                        - string
                        - 'null'
                      last_name:
                        type:
                        - string
                        - 'null'
                      created_at:
                        type: string
                    required:
                    - id
                    - username
                    - email
                    - first_name
                    - last_name
                    - created_at
                  token:
                    type: string
                required:
                - user
                - token
              example:
                user:
                  id: 2700
                  username: newuser
                  email: newuser@example.com
                  first_name:
                  last_name:
                  created_at: '2026-08-31T19:31:15.101Z'
                token: e55f0a3c2c112cbbfd63b5db9b8817bbaac9cb4daa3998f6f84b40352a427ef9
        '422':
          description: rejects duplicate emails case-insensitively
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Validation failed
                  details:
                  - Email has already been taken
        '429':
          description: throttles after 5 signups from the same IP within a minute
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Rate limit exceeded. Try again later.
                  details: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    username:
                      type: string
                    email:
                      type: string
                    password:
                      type: string
                    password_confirmation:
                      type: string
                    first_name:
                      type: string
                    last_name:
                      type: string
                  required:
                  - username
                  - email
                  - password
                  - password_confirmation
              required:
              - user
            example:
