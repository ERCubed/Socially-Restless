        '200':
          description: does not increment view_count when the profile's own user is
            viewing
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        body:
                          type: string
                        user_id:
                          type: integer
                        view_count:
                          type: integer
                        average_rating:
                          type: number
                          format: float
                        ratings_count:
                          type: integer
                        created_at:
                          type: string
                        updated_at:
                          type: string
                        lock_version:
                          type: integer
                      required:
                      - id
                      - title
                      - body
                      - user_id
                      - view_count
                      - average_rating
                      - ratings_count
                      - created_at
                      - updated_at
                  meta:
                    type: object
                    properties:
