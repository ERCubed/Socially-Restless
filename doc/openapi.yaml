---
openapi: 3.2.0
info:
  title: Socially Restless API
  version: 1.0.0
  description: 'A RESTful API for a social media application: user accounts, posts,
    ratings, and an activity timeline.'
servers:
- url: http://localhost:3000
  description: Local development
paths:
  "/api/v1/posts":
    post:
      summary: create
      tags:
      - Api::V1::Post
      responses:
        '201':
          description: ignores a client-supplied user_id and always attributes the
            post to the current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    type: object
                    properties:
                      id:
                        type: integer
                      title:
                        type: string
                      body:
                        type: string
                      user_id:
                        type: integer
                      view_count:
                        type: integer
                      average_rating:
                        type: number
                        format: float
                      ratings_count:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      lock_version:
                        type: integer
                    required:
                    - id
                    - title
                    - body
                    - user_id
                    - view_count
                    - average_rating
                    - ratings_count
                    - created_at
                    - updated_at
                required:
                - post
              example:
                post:
                  id: 807
                  title: Hello
                  body: Body
                  user_id: 1096
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  created_at: '2026-08-31T19:23:22.353Z'
                  updated_at: '2026-08-31T19:23:22.353Z'
                  lock_version: 0
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Unauthorized
                  details: []
        '422':
          description: returns a validation error for a body over 1000 characters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Validation failed
                  details:
                  - Body is too long (maximum is 1000 characters)
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer de1d22241c46f908d3c6e060f38206e3d63439d99da123778e1b361f9a01df63
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                post:
                  type: object
                  properties:
                    title:
                      type: string
                    body:
                      type: string
                    user_id:
                      type: string
                  required:
                  - title
                  - body
              required:
              - post
            example:
              post:
                title: Hello
                body: Body
                user_id: '1095'
  "/api/v1/posts/{id}":
    delete:
      summary: destroy
      tags:
      - Api::V1::Post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer 6072fc8576174f1284946319039ae7222f01b346216706f40c26bbd5257e8e04
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 0
      responses:
        '204':
          description: soft deletes the post without removing the row
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Unauthorized
                  details: []
        '404':
          description: 404s for a nonexistent post
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Post not found
                  details: []
    get:
      summary: show
      tags:
      - Api::V1::Post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer 37cc8e0a990e609120dad44faad74bb37105e226afeb2aa15d26bc9f8e2e8d46
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 805
      responses:
        '200':
          description: does not increment view_count when the author views their own
            post
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    type: object
                    properties:
                      id:
                        type: integer
                      title:
                        type: string
                      body:
                        type: string
                      user_id:
                        type: integer
                      view_count:
                        type: integer
                      average_rating:
                        type: number
                        format: float
                      ratings_count:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      lock_version:
                        type: integer
                    required:
                    - id
                    - title
                    - body
                    - user_id
                    - view_count
                    - average_rating
                    - ratings_count
                    - created_at
                    - updated_at
                required:
                - post
              example:
                post:
                  id: 805
                  title: Id modi quis qui.
                  body: Blanditiis rerum repudiandae. Culpa alias iure. Quaerat soluta
                    tenetur.
                  user_id: 1093
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  created_at: '2026-08-31T19:23:22.319Z'
                  updated_at: '2026-08-31T19:23:22.319Z'
                  lock_version: 0
        '404':
          description: 404s for a nonexistent post
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Post not found
                  details: []
    patch:
      summary: update
      tags:
      - Api::V1::Post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer 5d2f8a49c2639a260c04c03666af87e0d7bf27dd20a82e28ca9dfd24972b3588
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 0
      responses:
        '200':
          description: ignores a client-supplied user_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    type: object
                    properties:
                      id:
                        type: integer
                      title:
                        type: string
                      body:
                        type: string
                      user_id:
                        type: integer
                      view_count:
                        type: integer
                      average_rating:
                        type: number
                        format: float
                      ratings_count:
                        type: integer
                      lock_version:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - title
                    - body
                    - user_id
                    - view_count
                    - average_rating
                    - ratings_count
                    - lock_version
                    - created_at
                    - updated_at
                required:
                - post
              example:
                post:
                  id: 812
                  title: New
                  body: Original body
                  user_id: 1105
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  lock_version: 1
                  created_at: '2026-08-31T19:23:22.442Z'
                  updated_at: '2026-08-31T19:23:22.446Z'
        '400':
          description: requires lock_version to be present
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: 'param is missing or the value is empty or invalid: lock_version'
                  details: []
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Unauthorized
                  details: []
        '404':
          description: 404s for a nonexistent post
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Post not found
                  details: []
        '409':
          description: rejects a stale lock_version with 409, and does not apply the
            update
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: This record was updated by someone else since you last
                    loaded it. Reload and try again.
                  details: []
        '422':
          description: returns a validation error for a title over 100 characters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Validation failed
                  details:
                  - Title is too long (maximum is 100 characters)
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                post:
                  type: object
                  properties:
                    title:
                      type: string
                    body:
                      type: string
                    lock_version:
                      type: string
                    user_id:
                      type: string
                  required:
                  - title
                  - lock_version
              required:
              - post
            example:
              post:
                title: New
                body: Updated body
                lock_version: '0'
                user_id: '1104'
  "/api/v1/posts/{post_id}/rating":
    post:
      summary: create
      tags:
      - Api::V1::Rating
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer 58b9e83599ec9b52d72164c228bebfc0e4e6f41b95c0748a80bccdcc2333f3a3
      - name: post_id
        in: path
        required: true
        schema:
          type: integer
        example: 826
      responses:
        '200':
          description: updates the existing rating in place on a second call, without
            creating a duplicate
          content:
            application/json:
              schema:
                type: object
                properties:
                  rating:
                    type: object
                    properties:
                      id:
                        type: integer
                      post_id:
                        type: integer
                      user_id:
                        type: integer
                      score:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - post_id
                    - user_id
                    - score
                    - created_at
                    - updated_at
                required:
                - rating
              example:
                rating:
                  id: 150
                  post_id: 822
                  user_id: 1130
                  score: 5
                  created_at: '2026-08-31T19:23:22.889Z'
                  updated_at: '2026-08-31T19:23:22.896Z'
        '201':
          description: lets different users rate the same post independently
          content:
            application/json:
              schema:
                type: object
                properties:
                  rating:
                    type: object
                    properties:
                      id:
                        type: integer
                      post_id:
                        type: integer
                      user_id:
                        type: integer
                      score:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - post_id
                    - user_id
                    - score
                    - created_at
                    - updated_at
                required:
                - rating
              example:
                rating:
                  id: 152
                  post_id: 823
                  user_id: 1131
                  score: 5
                  created_at: '2026-08-31T19:23:22.924Z'
                  updated_at: '2026-08-31T19:23:22.924Z'
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Unauthorized
                  details: []
        '404':
          description: 404s for a soft-deleted post
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Post not found
                  details: []
        '422':
          description: rejects a missing score
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Validation failed
                  details:
                  - Score can't be blank
                  - Score is not included in the list
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                rating:
                  type: object
                  properties:
                    score:
                      type: string
                  required:
                  - score
              required:
              - rating
            example:
              rating:
                score: '5'
  "/api/v1/session":
    delete:
      summary: destroy
      tags:
      - Api::V1::Session
      responses:
        '204':
          description: revokes the session so the token can no longer authenticate
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer cc2d6239aa7ab2f21d8c2001732a58a4f3413d1383ae6ba0ce7eab72b1b2ce13
    post:
      summary: create
      tags:
      - Api::V1::Session
      responses:
        '200':
          description: logs in with mismatched email casing
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      email:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      created_at:
                        type: string
                    required:
                    - id
                    - username
                    - email
                    - first_name
                    - last_name
                    - created_at
                  token:
                    type: string
                required:
                - user
                - token
              example:
                user:
                  id: 1142
                  username: user157
                  email: user157@example.com
                  first_name: Oswaldo
                  last_name: Hintz
                  created_at: '2026-08-31T19:23:22.995Z'
                token: c11a53797f295c06c5becb28cab5a2dedbb59f5fa3c3841c0a12bd8ebb566f7e
        '401':
          description: rejects an unknown email
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Invalid email or password
                  details: []
        '429':
          description: returns the standard error envelope and a Retry-After header
            when throttled
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Rate limit exceeded. Try again later.
                  details: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                session:
                  type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                  required:
                  - email
                  - password
              required:
              - session
            example:
              session:
                email: USER157@EXAMPLE.COM
                password: password123
  "/api/v1/timeline":
    get:
      summary: index
      tags:
      - Api::V1::Timeline
      responses:
        '200':
          description: re-queries once the cache entry actually expires in Redis
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        body:
                          type: string
                        user_id:
                          type: integer
                        view_count:
                          type: integer
                        average_rating:
                          type: number
                          format: float
                        ratings_count:
                          type: integer
                        created_at:
                          type: string
                        updated_at:
                          type: string
                        author:
                          type: object
                          properties:
                            id:
                              type: integer
                            username:
                              type: string
                            email:
                              type: string
                            first_name:
                              type: string
                            last_name:
                              type: string
                            created_at:
                              type: string
                          required:
                          - id
                          - username
                          - email
                          - first_name
                          - last_name
                          - created_at
                        lock_version:
                          type: integer
                      required:
                      - id
                      - title
                      - body
                      - user_id
                      - view_count
                      - average_rating
                      - ratings_count
                      - created_at
                      - updated_at
                      - author
                  meta:
                    type: object
                    properties:
                      per_page:
                        type: integer
                      has_more:
                        type: boolean
                      next_cursor:
                        type:
                        - string
                        - 'null'
                    required:
                    - per_page
                    - has_more
                    - next_cursor
                required:
                - posts
                - meta
              example:
                posts:
                - id: 902
                  title: Deserunt error odit laudantium.
                  body: Quidem labore facere. Blanditiis voluptatem qui. Qui mollitia
                    voluptates.
                  user_id: 1228
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  lock_version: 0
                  created_at: '2026-08-31T19:23:23.674Z'
                  updated_at: '2026-08-31T19:23:23.674Z'
                  author:
                    id: 1228
                    username: user240
                    email: user243@example.com
                    first_name: Stuart
                    last_name: Feil
                    created_at: '2026-08-31T19:23:23.671Z'
                - id: 901
                  title: Ea pariatur sed non.
                  body: Rerum ut cupiditate. Modi culpa sequi. Iure et ab.
                  user_id: 1227
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  lock_version: 0
                  created_at: '2026-08-31T19:23:23.561Z'
                  updated_at: '2026-08-31T19:23:23.561Z'
                  author:
                    id: 1227
                    username: user239
                    email: user242@example.com
                    first_name: Vilma
                    last_name: Bartoletti
                    created_at: '2026-08-31T19:23:23.560Z'
                meta:
                  per_page: 10
                  has_more: false
                  next_cursor:
        '400':
          description: returns a 400 for a malformed cursor instead of silently restarting
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: invalid pagination cursor
                  details: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        example: MjAyNi0wOC0zMVQxOToyMzoyMy40OTczODRafDg5NQ==
      - name: min_rating
        in: query
        required: false
        schema:
          oneOf:
          - type: integer
          - type: string
        example: 4
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        example: 2
  "/api/v1/users":
    post:
      summary: create
      tags:
      - Api::V1::User
      responses:
        '201':
          description: creates a user without a first or last name
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      email:
                        type: string
                      first_name:
                        type:
                        - string
                        - 'null'
                      last_name:
                        type:
                        - string
                        - 'null'
                      created_at:
                        type: string
                    required:
                    - id
                    - username
                    - email
                    - first_name
                    - last_name
                    - created_at
                  token:
                    type: string
                required:
                - user
                - token
              example:
                user:
                  id: 1242
                  username: newuser
                  email: newuser@example.com
                  first_name:
                  last_name:
                  created_at: '2026-08-31T19:23:23.875Z'
                token: b6cd30b195b269b976fbb6a265c8ff663c0f4f889f6147ea134c944791ef42bc
        '422':
          description: rejects duplicate emails case-insensitively
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Validation failed
                  details:
                  - Email has already been taken
        '429':
          description: throttles after 5 signups from the same IP within a minute
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Rate limit exceeded. Try again later.
                  details: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    username:
                      type: string
                    email:
                      type: string
                    password:
                      type: string
                    password_confirmation:
                      type: string
                    first_name:
                      type: string
                    last_name:
                      type: string
                  required:
                  - username
                  - email
                  - password
                  - password_confirmation
              required:
              - user
            example:
              user:
                username: newuser
                email: newuser@example.com
                password: password123
                password_confirmation: password123
                first_name: Jane
                last_name: Doe
  "/api/v1/users/{user_username}/posts":
    get:
      summary: index
      tags:
      - Api::V1::Users::Post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer f452e405651828ec1e3dd42ceedc7ab8e659b7ac7afc958879a46fbb4b16ad9a
      - name: page
        in: query
        required: false
        schema:
          oneOf:
          - type: integer
          - type: string
        example: not-a-number
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        example: -5
      - name: user_username
        in: path
        required: true
        schema:
          type: string
        example: alice
      responses:
        '200':
          description: does not increment view_count when the profile's own user is
            viewing
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        body:
                          type: string
                        user_id:
                          type: integer
                        view_count:
                          type: integer
                        average_rating:
                          type: number
                          format: float
                        ratings_count:
                          type: integer
                        created_at:
                          type: string
                        updated_at:
                          type: string
                        lock_version:
                          type: integer
                      required:
                      - id
                      - title
                      - body
                      - user_id
                      - view_count
                      - average_rating
                      - ratings_count
                      - created_at
                      - updated_at
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
                      total_pages:
                        type: integer
                    required:
                    - page
                    - per_page
                    - total_count
                    - total_pages
                required:
                - posts
                - meta
              example:
                posts:
                - id: 944
                  title: Exercitationem hic facilis similique.
                  body: Officia quos sed. Ut labore incidunt. Quidem quos vel.
                  user_id: 1240
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  lock_version: 0
                  created_at: '2026-08-31T19:23:23.850Z'
                  updated_at: '2026-08-31T19:23:23.850Z'
                - id: 943
                  title: Et ut laboriosam sequi.
                  body: Aut laborum similique. Quia eos ipsa. Odit autem non.
                  user_id: 1240
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  lock_version: 0
                  created_at: '2026-08-31T19:23:23.846Z'
                  updated_at: '2026-08-31T19:23:23.846Z'
                meta:
                  page: 1
                  per_page: 10
                  total_count: 2
                  total_pages: 1
  "/health":
    get:
      summary: show
      tags:
      - Health
      responses:
        '200':
          description: is not one of the pass/fail subsystem checks
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  checked_at:
                    type: string
                  subsystems:
                    type: object
                    properties:
                      database:
                        type: object
                        properties:
                          status:
                            type: string
                          critical:
                            type: boolean
                          latency_ms:
                            type: number
                            format: float
                        required:
                        - status
                        - critical
                        - latency_ms
                      cache:
                        type: object
                        properties:
                          status:
                            type: string
                          critical:
                            type: boolean
                          latency_ms:
                            type: number
                            format: float
                          error:
                            type: string
                        required:
                        - status
                        - critical
                      rate_limiter:
                        type: object
                        properties:
                          status:
                            type: string
                          critical:
                            type: boolean
                          latency_ms:
                            type: number
                            format: float
                          error:
                            type: string
                        required:
                        - status
                        - critical
                    required:
                    - database
                    - cache
                    - rate_limiter
                  latest_commit:
                    type:
                    - string
                    - 'null'
                required:
                - status
                - checked_at
                - subsystems
              example:
                status: ok
                checked_at: '2026-08-31T19:23:23Z'
                subsystems:
                  database:
                    status: ok
                    critical: true
                    latency_ms: 0.52
                  cache:
                    status: ok
                    critical: false
                    latency_ms: 0.16
                    error: Redis::CannotConnectError
                  rate_limiter:
                    status: ok
                    critical: false
                    latency_ms: 0.28
                    error: Redis::CannotConnectError
                latest_commit: f9a830c2a7
        '503':
          description: returns 503 and status unavailable when the database is unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  checked_at:
                    type: string
                  subsystems:
                    type: object
                    properties:
                      database:
                        type: object
                        properties:
                          status:
                            type: string
                          critical:
                            type: boolean
                          error:
                            type: string
                        required:
                        - status
                        - critical
                        - error
                      cache:
                        type: object
                        properties:
                          status:
                            type: string
                          critical:
                            type: boolean
                          latency_ms:
                            type: number
                            format: float
                        required:
                        - status
                        - critical
                        - latency_ms
                      rate_limiter:
                        type: object
                        properties:
                          status:
                            type: string
                          critical:
                            type: boolean
                          latency_ms:
                            type: number
                            format: float
                        required:
                        - status
                        - critical
                        - latency_ms
                    required:
                    - database
                    - cache
                    - rate_limiter
                  latest_commit:
                    type: string
                required:
                - status
                - checked_at
                - subsystems
              example:
                status: unavailable
                checked_at: '2026-08-31T19:23:23Z'
                subsystems:
                  database:
                    status: error
                    critical: true
                    error: PG::ConnectionBad
                  cache:
                    status: ok
                    critical: false
                    latency_ms: 0.25
                  rate_limiter:
                    status: ok
                    critical: false
                    latency_ms: 0.11
                latest_commit: f9a830c2a7
  "/up":
    get:
      summary: show
      tags:
      - Rails::Health
      responses:
        '200':
          description: does not apply to non-API paths
          content:
            text/html:
              schema:
                type: string
              example: '<!DOCTYPE html><html><body style="background-color: green"></body></html>'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token returned by POST /api/v1/users or POST /api/v1/session
