---
openapi: 3.2.0
info:
  title: Socially Restless API
  version: 1.0.0
  description: 'A RESTful API for a social media application: user accounts, posts,
    ratings, and an activity timeline.'
servers:
- url: http://localhost:3000
  description: Local development
paths:
  "/api/v1/posts":
    post:
      summary: create
      tags:
      - Api::V1::Post
      responses:
        '201':
          description: ignores a client-supplied user_id and always attributes the
            post to the current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    type: object
                    properties:
                      id:
                        type: integer
                      title:
                        type: string
                      body:
                        type: string
                      user_id:
                        type: integer
                      view_count:
                        type: integer
                      average_rating:
                        type: number
                        format: float
                      ratings_count:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - title
                    - body
                    - user_id
                    - view_count
                    - average_rating
                    - ratings_count
                    - created_at
                    - updated_at
                required:
                - post
              example:
                post:
                  id: 5832
                  title: Hello
                  body: Body
                  user_id: 7714
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  created_at: '2026-08-31T18:02:46.616Z'
                  updated_at: '2026-08-31T18:02:46.616Z'
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Unauthorized
                  details: []
        '422':
          description: returns a validation error for a body over 1000 characters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Validation failed
                  details:
                  - Body is too long (maximum is 1000 characters)
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer b0eda361b3ac48ba12778eee459513bfbe6f30ae84e7ce4ac8cd3433eb937165
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                post:
                  type: object
                  properties:
                    title:
                      type: string
                    body:
                      type: string
                    user_id:
                      type: string
                  required:
                  - title
                  - body
              required:
              - post
            example:
              post:
                title: Hello
                body: Body
                user_id: '7713'
  "/api/v1/posts/{id}":
    delete:
      summary: destroy
      tags:
      - Api::V1::Post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer 9e44d6c9f2cb74bd4be21c044e86dfdf4b7c5221fa7c8e618d3b5b880ebd93c0
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 0
      responses:
        '204':
          description: soft deletes the post without removing the row
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Unauthorized
                  details: []
        '404':
          description: 404s for a nonexistent post
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Post not found
                  details: []
    get:
      summary: show
      tags:
      - Api::V1::Post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer b58fc99a3943323356415e17ad19c03c3d3211715d93a98dd113ba14ba0d60cc
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 5830
      responses:
        '200':
          description: does not increment view_count when the author views their own
            post
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    type: object
                    properties:
                      id:
                        type: integer
                      title:
                        type: string
                      body:
                        type: string
                      user_id:
                        type: integer
                      view_count:
                        type: integer
                      average_rating:
                        type: number
                        format: float
                      ratings_count:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - title
                    - body
                    - user_id
                    - view_count
                    - average_rating
                    - ratings_count
                    - created_at
                    - updated_at
                required:
                - post
              example:
                post:
                  id: 5830
                  title: Vitae occaecati saepe nisi.
                  body: Aut sint voluptatem. Dolore omnis nobis. Aliquam minima occaecati.
                  user_id: 7711
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  created_at: '2026-08-31T18:02:46.581Z'
                  updated_at: '2026-08-31T18:02:46.581Z'
        '404':
          description: 404s for a nonexistent post
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Post not found
                  details: []
  "/api/v1/posts/{post_id}/rating":
    post:
      summary: create
      tags:
      - Api::V1::Rating
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer f61042544e167223e5adf14a05d8fd3b4132496ac7e2f3044095a01663746889
      - name: post_id
        in: path
        required: true
        schema:
          type: integer
        example: 5843
      responses:
        '200':
          description: updates the existing rating in place on a second call, without
            creating a duplicate
          content:
            application/json:
              schema:
                type: object
                properties:
                  rating:
                    type: object
                    properties:
                      id:
                        type: integer
                      post_id:
                        type: integer
                      user_id:
                        type: integer
                      score:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - post_id
                    - user_id
                    - score
                    - created_at
                    - updated_at
                required:
                - rating
              example:
                rating:
                  id: 1105
                  post_id: 5839
                  user_id: 7737
                  score: 5
                  created_at: '2026-08-31T18:02:47.027Z'
                  updated_at: '2026-08-31T18:02:47.033Z'
        '201':
          description: lets different users rate the same post independently
          content:
            application/json:
              schema:
                type: object
                properties:
                  rating:
                    type: object
                    properties:
                      id:
                        type: integer
                      post_id:
                        type: integer
                      user_id:
                        type: integer
                      score:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - post_id
                    - user_id
                    - score
                    - created_at
                    - updated_at
                required:
                - rating
              example:
                rating:
                  id: 1107
                  post_id: 5840
                  user_id: 7738
                  score: 5
                  created_at: '2026-08-31T18:02:47.061Z'
                  updated_at: '2026-08-31T18:02:47.061Z'
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Unauthorized
                  details: []
        '404':
          description: 404s for a soft-deleted post
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Post not found
                  details: []
        '422':
          description: rejects a missing score
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Validation failed
                  details:
                  - Score can't be blank
                  - Score is not included in the list
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                rating:
                  type: object
                  properties:
                    score:
                      type: string
                  required:
                  - score
              required:
              - rating
            example:
              rating:
                score: '5'
  "/api/v1/session":
    delete:
      summary: destroy
      tags:
      - Api::V1::Session
      responses:
        '204':
          description: revokes the session so the token can no longer authenticate
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer 6a1ac4c83e24ae70172245b891e532d007e2a364325ef5687f22a16fb770d527
    post:
      summary: create
      tags:
      - Api::V1::Session
      responses:
        '200':
          description: logs in with mismatched email casing
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      email:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      created_at:
                        type: string
                    required:
                    - id
                    - username
                    - email
                    - first_name
                    - last_name
                    - created_at
                  token:
                    type: string
                required:
                - user
                - token
              example:
                user:
                  id: 7749
                  username: user146
                  email: user146@example.com
                  first_name: Avis
                  last_name: Mayert
                  created_at: '2026-08-31T18:02:47.131Z'
                token: '09db7c1c0d4836a466f16d7dd0d5a7e7e677d9b3e8f03cca215924d1b05d3054'
        '401':
          description: rejects an unknown email
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Invalid email or password
                  details: []
        '429':
          description: returns the standard error envelope and a Retry-After header
            when throttled
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Rate limit exceeded. Try again later.
                  details: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                session:
                  type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                  required:
                  - email
                  - password
              required:
              - session
            example:
              session:
                email: USER146@EXAMPLE.COM
                password: password123
  "/api/v1/timeline":
    get:
      summary: index
      tags:
      - Api::V1::Timeline
      responses:
        '200':
          description: re-queries once the cache entry actually expires in Redis
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        body:
                          type: string
                        user_id:
                          type: integer
                        view_count:
                          type: integer
                        average_rating:
                          type: number
                          format: float
                        ratings_count:
                          type: integer
                        created_at:
                          type: string
                        updated_at:
                          type: string
                        author:
                          type: object
                          properties:
                            id:
                              type: integer
                            username:
                              type: string
                            email:
                              type: string
                            first_name:
                              type: string
                            last_name:
                              type: string
                            created_at:
                              type: string
                          required:
                          - id
                          - username
                          - email
                          - first_name
                          - last_name
                          - created_at
                      required:
                      - id
                      - title
                      - body
                      - user_id
                      - view_count
                      - average_rating
                      - ratings_count
                      - created_at
                      - updated_at
                      - author
                  meta:
                    type: object
                    properties:
                      per_page:
                        type: integer
                      has_more:
                        type: boolean
                      next_cursor:
                        type:
                        - string
                        - 'null'
                    required:
                    - per_page
                    - has_more
                    - next_cursor
                required:
                - posts
                - meta
              example:
                posts:
                - id: 5919
                  title: Nisi saepe quod error.
                  body: Aliquid qui ex. Nihil qui eum. Veniam id libero.
                  user_id: 7835
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  created_at: '2026-08-31T18:02:47.831Z'
                  updated_at: '2026-08-31T18:02:47.831Z'
                  author:
                    id: 7835
                    username: user229
                    email: user232@example.com
                    first_name: Manual
                    last_name: Emmerich
                    created_at: '2026-08-31T18:02:47.829Z'
                - id: 5918
                  title: Aut neque illo voluptates.
                  body: Inventore eos vel. Qui saepe voluptatem. Consequatur suscipit
                    animi.
                  user_id: 7834
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  created_at: '2026-08-31T18:02:47.713Z'
                  updated_at: '2026-08-31T18:02:47.713Z'
                  author:
                    id: 7834
                    username: user228
                    email: user231@example.com
                    first_name: Patti
                    last_name: Olson
                    created_at: '2026-08-31T18:02:47.711Z'
                meta:
                  per_page: 10
                  has_more: false
                  next_cursor:
        '400':
          description: returns a 400 for a malformed cursor instead of silently restarting
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: invalid pagination cursor
                  details: []
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
        example: MjAyNi0wOC0zMVQxODowMjo0Ny42NDg2NzJafDU5MTI=
      - name: min_rating
        in: query
        required: false
        schema:
          oneOf:
          - type: integer
          - type: string
        example: 4
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        example: 2
  "/api/v1/users":
    post:
      summary: create
      tags:
      - Api::V1::User
      responses:
        '201':
          description: creates a user without a first or last name
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      email:
                        type: string
                      first_name:
                        type:
                        - string
                        - 'null'
                      last_name:
                        type:
                        - string
                        - 'null'
                      created_at:
                        type: string
                    required:
                    - id
                    - username
                    - email
                    - first_name
                    - last_name
                    - created_at
                  token:
                    type: string
                required:
                - user
                - token
              example:
                user:
                  id: 7849
                  username: newuser
                  email: newuser@example.com
                  first_name:
                  last_name:
                  created_at: '2026-08-31T18:02:48.020Z'
                token: dcb8e8db8d5ae04f66ca473ab7b7a8a5ff70b92c9238053444bdd58618166d62
        '422':
          description: rejects duplicate emails case-insensitively
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Validation failed
                  details:
                  - Email has already been taken
        '429':
          description: throttles after 5 signups from the same IP within a minute
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Rate limit exceeded. Try again later.
                  details: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    username:
                      type: string
                    email:
                      type: string
                    password:
                      type: string
                    password_confirmation:
                      type: string
                    first_name:
                      type: string
                    last_name:
                      type: string
                  required:
                  - username
                  - email
                  - password
                  - password_confirmation
              required:
              - user
            example:
              user:
                username: newuser
                email: newuser@example.com
                password: password123
                password_confirmation: password123
                first_name: Jane
                last_name: Doe
  "/api/v1/users/{user_username}/posts":
    get:
      summary: index
      tags:
      - Api::V1::Users::Post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer 6628231e348d778b7c0f7aaa2db0eed1f39908a60f049cab5cb84e86b458e683
      - name: page
        in: query
        required: false
        schema:
          oneOf:
          - type: integer
          - type: string
        example: not-a-number
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        example: -5
      - name: user_username
        in: path
        required: true
        schema:
          type: string
        example: alice
      responses:
        '200':
          description: does not increment view_count when the profile's own user is
            viewing
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        body:
                          type: string
                        user_id:
                          type: integer
                        view_count:
                          type: integer
                        average_rating:
                          type: number
                          format: float
                        ratings_count:
                          type: integer
                        created_at:
                          type: string
                        updated_at:
                          type: string
                      required:
                      - id
                      - title
                      - body
                      - user_id
                      - view_count
                      - average_rating
                      - ratings_count
                      - created_at
                      - updated_at
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
                      total_pages:
                        type: integer
                    required:
                    - page
                    - per_page
                    - total_count
                    - total_pages
                required:
                - posts
                - meta
              example:
                posts:
                - id: 5961
                  title: Labore in dolor sed.
                  body: Sequi commodi iste. Placeat velit omnis. Voluptatem odio eius.
                  user_id: 7847
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  created_at: '2026-08-31T18:02:48.002Z'
                  updated_at: '2026-08-31T18:02:48.002Z'
                - id: 5960
                  title: Nisi eligendi aut natus.
                  body: Laudantium assumenda eligendi. Porro sunt quam. Libero rerum
                    dolores.
                  user_id: 7847
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  created_at: '2026-08-31T18:02:48.001Z'
                  updated_at: '2026-08-31T18:02:48.001Z'
                meta:
                  page: 1
                  per_page: 10
                  total_count: 2
                  total_pages: 1
  "/up":
    get:
      summary: show
      tags:
      - Rails::Health
      responses:
        '200':
          description: does not apply to non-API paths
          content:
            text/html:
              schema:
                type: string
              example: '<!DOCTYPE html><html><body style="background-color: green"></body></html>'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token returned by POST /api/v1/users or POST /api/v1/session
