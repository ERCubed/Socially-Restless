---
openapi: 3.2.0
info:
  title: Socially Restless API
  version: 1.0.0
  description: 'A RESTful API for a social media application: user accounts, posts,
    ratings, and an activity timeline.'
servers:
- url: http://localhost:3000
  description: Local development
paths:
  "/api/v1/posts":
    post:
      summary: create
      tags:
      - Api::V1::Post
      responses:
        '201':
          description: defaults metadata to an empty object when not given
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    type: object
                    properties:
                      id:
                        type: integer
                      title:
                        type: string
                      body:
                        type: string
                      user_id:
                        type: integer
                      view_count:
                        type: integer
                      average_rating:
                        type: number
                        format: float
                      ratings_count:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      lock_version:
                        type: integer
                      metadata:
                        type: object
                        properties:
                          tags:
                            type: array
                            items:
                              type: string
                    required:
                    - id
                    - title
                    - body
                    - user_id
                    - view_count
                    - average_rating
                    - ratings_count
                    - created_at
                    - updated_at
                required:
                - post
              example:
                post:
                  id: 1107
                  title: Hello world
                  body: This is my first post.
                  user_id: 1401
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  created_at: '2026-08-31T20:51:36.428Z'
                  updated_at: '2026-08-31T20:51:36.428Z'
                  lock_version: 0
                  metadata:
                    tags:
                    - ruby
                    - rails
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Unauthorized
                  details: []
        '422':
          description: returns a validation error for a body over 1000 characters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Validation failed
                  details:
                  - Body is too long (maximum is 1000 characters)
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer f58f9938012f0d4d5098aa1ba91e11dff12cae896936135a5405ec393b5e171f
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                post:
                  type: object
                  properties:
                    title:
                      type: string
                    body:
                      type: string
                    user_id:
                      type: string
                    metadata:
                      type: object
                      properties:
                        tags:
                          type: array
                          items:
                            type: string
                      required:
                      - tags
                  required:
                  - title
                  - body
              required:
              - post
            example:
              post:
                title: Hello world
                body: This is my first post.
                user_id: '1398'
                metadata:
                  tags:
                  - ruby
                  - rails
  "/api/v1/posts/search":
    get:
      summary: search
      tags:
      - Api::V1::Post
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
        example: 2
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        example: 5
      - name: q
        in: query
        required: false
        schema:
          type: string
        example: astronomy
      responses:
        '200':
          description: paginates results with page/per_page
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        body:
                          type: string
                        user_id:
                          type: integer
                        view_count:
                          type: integer
                        average_rating:
                          type: number
                          format: float
                        ratings_count:
                          type: integer
                        lock_version:
                          type: integer
                        created_at:
                          type: string
                        updated_at:
                          type: string
                        author:
                          type: object
                          properties:
                            id:
                              type: integer
                            username:
                              type: string
                            email:
                              type: string
                            first_name:
                              type: string
                            last_name:
                              type: string
                            created_at:
                              type: string
                          required:
                          - id
                          - username
                          - email
                          - first_name
                          - last_name
                          - created_at
                        metadata:
                          type: object
                          properties: {}
                      required:
                      - id
                      - title
                      - body
                      - user_id
                      - view_count
                      - average_rating
                      - ratings_count
                      - lock_version
                      - created_at
                      - updated_at
                      - author
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_count:
                        type: integer
                      total_pages:
                        type: integer
                    required:
                    - page
                    - per_page
                    - total_count
                    - total_pages
                required:
                - posts
                - meta
              example:
                posts:
                - id: 1089
                  title: Astronomy post 5
                  body: Body
                  user_id: 1381
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  lock_version: 0
                  metadata: {}
                  created_at: '2026-08-31T20:51:36.270Z'
                  updated_at: '2026-08-31T20:51:36.270Z'
                  author:
                    id: 1381
                    username: user154
                    email: user158@example.com
                    first_name: Jeffrey
                    last_name: Klein
                    created_at: '2026-08-31T20:51:36.269Z'
                - id: 1090
                  title: Astronomy post 6
                  body: Body
                  user_id: 1382
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  lock_version: 0
                  metadata: {}
                  created_at: '2026-08-31T20:51:36.274Z'
                  updated_at: '2026-08-31T20:51:36.274Z'
                  author:
                    id: 1382
                    username: user155
                    email: user159@example.com
                    first_name: Wendolyn
                    last_name: Reichert
                    created_at: '2026-08-31T20:51:36.273Z'
                - id: 1091
                  title: Astronomy post 7
                  body: Body
                  user_id: 1383
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  lock_version: 0
                  metadata: {}
                  created_at: '2026-08-31T20:51:36.278Z'
                  updated_at: '2026-08-31T20:51:36.278Z'
                  author:
                    id: 1383
                    username: user156
                    email: user160@example.com
                    first_name: Grant
                    last_name: Weber
                    created_at: '2026-08-31T20:51:36.277Z'
                - id: 1092
                  title: Astronomy post 8
                  body: Body
                  user_id: 1384
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  lock_version: 0
                  metadata: {}
                  created_at: '2026-08-31T20:51:36.282Z'
                  updated_at: '2026-08-31T20:51:36.282Z'
                  author:
                    id: 1384
                    username: user157
                    email: user161@example.com
                    first_name: Trista
                    last_name: Frami
                    created_at: '2026-08-31T20:51:36.281Z'
                - id: 1093
                  title: Astronomy post 9
                  body: Body
                  user_id: 1385
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  lock_version: 0
                  metadata: {}
                  created_at: '2026-08-31T20:51:36.285Z'
                  updated_at: '2026-08-31T20:51:36.285Z'
                  author:
                    id: 1385
                    username: user158
                    email: user162@example.com
                    first_name: Rolanda
                    last_name: Doyle
                    created_at: '2026-08-31T20:51:36.285Z'
                meta:
                  page: 2
                  per_page: 5
                  total_count: 15
                  total_pages: 3
        '400':
          description: requires q to be non-blank
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: 'param is missing or the value is empty or invalid: q'
                  details: []
  "/api/v1/posts/{id}":
    delete:
      summary: destroy
      tags:
      - Api::V1::Post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer ccc1ce9b95ff7db9dd6998415eccd5cc2d02d8ebfbea3052f6eb2c8cb47cac52
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 0
      responses:
        '204':
          description: soft deletes the post without removing the row
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Unauthorized
                  details: []
        '404':
          description: 404s for a nonexistent post
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Post not found
                  details: []
    get:
      summary: show
      tags:
      - Api::V1::Post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer d51644dde075267dbb3714e2bfa981f3b23c2026e753251610f3f488ef82ddf6
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 1103
      responses:
        '200':
          description: does not increment view_count when the author views their own
            post
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    type: object
                    properties:
                      id:
                        type: integer
                      title:
                        type: string
                      body:
                        type: string
                      user_id:
                        type: integer
                      view_count:
                        type: integer
                      average_rating:
                        type: number
                        format: float
                      ratings_count:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      lock_version:
                        type: integer
                      metadata:
                        type: object
                        properties: {}
                    required:
                    - id
                    - title
                    - body
                    - user_id
                    - view_count
                    - average_rating
                    - ratings_count
                    - created_at
                    - updated_at
                required:
                - post
              example:
                post:
                  id: 1103
                  title: Cumque ipsam repudiandae quis.
                  body: Aut quibusdam aut. Sed non quis. Autem aspernatur sequi.
                  user_id: 1396
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  created_at: '2026-08-31T20:51:36.375Z'
                  updated_at: '2026-08-31T20:51:36.375Z'
                  lock_version: 0
                  metadata: {}
        '404':
          description: 404s for a nonexistent post
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Post not found
                  details: []
    patch:
      summary: update
      tags:
      - Api::V1::Post
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer 4dbda8a43f2fe05a328d458cb7fa7a80a2a2ddd705027fba773a255fbe5069a6
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 0
      responses:
        '200':
          description: ignores a client-supplied user_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    type: object
                    properties:
                      id:
                        type: integer
                      title:
                        type: string
                      body:
                        type: string
                      user_id:
                        type: integer
                      view_count:
                        type: integer
                      average_rating:
                        type: number
                        format: float
                      ratings_count:
                        type: integer
                      lock_version:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                      metadata:
                        type: object
                        properties:
                          tags:
                            type: array
                            items:
                              type: string
                    required:
                    - id
                    - title
                    - body
                    - user_id
                    - view_count
                    - average_rating
                    - ratings_count
                    - lock_version
                    - created_at
                    - updated_at
                required:
                - post
              example:
                post:
                  id: 1114
                  title: New
                  body: Original body
                  user_id: 1412
                  view_count: 0
                  average_rating: 0.0
                  ratings_count: 0
                  lock_version: 1
                  created_at: '2026-08-31T20:51:36.540Z'
                  updated_at: '2026-08-31T20:51:36.545Z'
                  metadata:
                    tags:
                    - ruby
        '400':
          description: requires lock_version to be present
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: 'param is missing or the value is empty or invalid: lock_version'
                  details: []
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Unauthorized
                  details: []
        '404':
          description: 404s for a nonexistent post
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Post not found
                  details: []
        '409':
          description: rejects a stale lock_version with 409, and does not apply the
            update
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: This record was updated by someone else since you last
                    loaded it. Reload and try again.
                  details: []
        '422':
          description: returns a validation error for a title over 100 characters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Validation failed
                  details:
                  - Title is too long (maximum is 100 characters)
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                post:
                  type: object
                  properties:
                    title:
                      type: string
                    body:
                      type: string
                    lock_version:
                      type: string
                    user_id:
                      type: string
                    metadata:
                      type: object
                      properties:
                        tags:
                          type: array
                          items:
                            type: string
                      required:
                      - tags
                  required:
                  - title
                  - lock_version
              required:
              - post
            example:
              post:
                title: New
                body: Updated body
                lock_version: '0'
                user_id: '1411'
                metadata:
                  tags:
                  - ruby
  "/api/v1/posts/{post_id}/rating":
    post:
      summary: create
      tags:
      - Api::V1::Rating
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        example: Bearer 3ece5b33e1577d12431a20224e91717dea4ec6a0f54ca92c49944a5fec45073d
      - name: post_id
        in: path
        required: true
        schema:
          type: integer
        example: 1128
      responses:
        '200':
          description: updates the existing rating in place on a second call, without
            creating a duplicate
          content:
            application/json:
              schema:
                type: object
                properties:
                  rating:
                    type: object
                    properties:
                      id:
                        type: integer
                      post_id:
                        type: integer
                      user_id:
                        type: integer
                      score:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - post_id
                    - user_id
                    - score
                    - created_at
                    - updated_at
                required:
                - rating
              example:
                rating:
                  id: 165
                  post_id: 1124
                  user_id: 1437
                  score: 5
                  created_at: '2026-08-31T20:51:36.984Z'
                  updated_at: '2026-08-31T20:51:36.995Z'
        '201':
          description: lets different users rate the same post independently
          content:
            application/json:
              schema:
                type: object
                properties:
                  rating:
                    type: object
                    properties:
                      id:
                        type: integer
                      post_id:
                        type: integer
                      user_id:
                        type: integer
                      score:
                        type: integer
                      created_at:
                        type: string
                      updated_at:
                        type: string
                    required:
                    - id
                    - post_id
                    - user_id
                    - score
                    - created_at
                    - updated_at
                required:
                - rating
              example:
                rating:
                  id: 167
                  post_id: 1125
                  user_id: 1438
                  score: 5
                  created_at: '2026-08-31T20:51:37.034Z'
                  updated_at: '2026-08-31T20:51:37.034Z'
        '401':
          description: requires authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Unauthorized
                  details: []
        '404':
          description: 404s for a soft-deleted post
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Post not found
                  details: []
        '422':
          description: rejects a missing score
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items:
                          type: string
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Validation failed
                  details:
                  - Score can't be blank
                  - Score is not included in the list
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                rating:
                  type: object
                  properties:
                    score:
                      type: string
                  required:
                  - score
              required:
              - rating
            example:
              rating:
                score: '5'
  "/api/v1/session":
    delete:
      summary: destroy
      tags:
      - Api::V1::Session
      responses:
        '204':
          description: revokes the session so the token can no longer authenticate
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        example: Bearer a6edea81864dfe00fe13ca10a1d8ccda02b376bddabb4c5fb6315582d31a08bc
    post:
      summary: create
      tags:
      - Api::V1::Session
      responses:
        '200':
          description: logs in with mismatched email casing
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      email:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      created_at:
                        type: string
                    required:
                    - id
                    - username
                    - email
                    - first_name
                    - last_name
                    - created_at
                  token:
                    type: string
                required:
                - user
                - token
              example:
                user:
                  id: 1449
                  username: user217
                  email: user221@example.com
                  first_name: Kyle
                  last_name: Gleichner
                  created_at: '2026-08-31T20:51:37.105Z'
                token: a244b724a0d19aa474a8a0266c5b73e756dc3c649114b7b4e49aa71a30bf55a7
        '401':
          description: rejects an unknown email
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Invalid email or password
                  details: []
        '429':
          description: returns the standard error envelope and a Retry-After header
            when throttled
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: Rate limit exceeded. Try again later.
                  details: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                session:
                  type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                  required:
                  - email
                  - password
              required:
              - session
            example:
              session:
                email: USER221@EXAMPLE.COM
                password: password123
  "/api/v1/timeline":
    get:
      summary: index
      tags:
      - Api::V1::Timeline
      responses:
        '200':
          description: re-queries once the cache entry actually expires in Redis
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
