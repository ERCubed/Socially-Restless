          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
                required:
                - error
              example:
                error:
                  message: invalid pagination cursor
                  details: []
        '503':
          description: returns a 503 with the standard error envelope instead of a
            raw 500
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      details:
                        type: array
                        items: {}
                    required:
                    - message
                    - details
