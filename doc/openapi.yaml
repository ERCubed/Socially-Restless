  "/health":
    get:
      summary: show
      tags:
      - Health
      responses:
        '200':
          description: is not one of the pass/fail subsystem checks
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  checked_at:
                    type: string
                  subsystems:
                    type: object
                    properties:
                      database:
                        type: object
                        properties:
                          status:
                            type: string
                          critical:
                            type: boolean
                          latency_ms:
                            type: number
                            format: float
                        required:
                        - status
                        - critical
                        - latency_ms
                      cache:
                        type: object
                        properties:
                          status:
                            type: string
                          critical:
                            type: boolean
                          latency_ms:
                            type: number
                            format: float
                          error:
                            type: string
                        required:
                        - status
                        - critical
                      rate_limiter:
                        type: object
                        properties:
                          status:
                            type: string
                          critical:
                            type: boolean
                          latency_ms:
                            type: number
                            format: float
                          error:
                            type: string
                        required:
                        - status
                        - critical
                    required:
                    - database
                    - cache
                    - rate_limiter
                  latest_commit:
                    type:
                    - string
                    - 'null'
                required:
                - status
                - checked_at
                - subsystems
              example:
                status: ok
                checked_at: '2026-08-31T20:51:38Z'
                subsystems:
                  database:
                    status: ok
                    critical: true
                    latency_ms: 0.22
                  cache:
                    status: ok
                    critical: false
                    latency_ms: 0.17
                    error: Redis::CannotConnectError
                  rate_limiter:
                    status: ok
                    critical: false
                    latency_ms: 0.13
                    error: Redis::CannotConnectError
                latest_commit: 538b30d6e2
        '503':
          description: returns 503 and status unavailable when the database is unreachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  checked_at:
                    type: string
                  subsystems:
                    type: object
                    properties:
                      database:
                        type: object
                        properties:
                          status:
                            type: string
                          critical:
                            type: boolean
                          error:
                            type: string
                        required:
                        - status
                        - critical
                        - error
                      cache:
                        type: object
                        properties:
                          status:
                            type: string
                          critical:
                            type: boolean
                          latency_ms:
                            type: number
                            format: float
                        required:
                        - status
                        - critical
                        - latency_ms
                      rate_limiter:
                        type: object
                        properties:
                          status:
                            type: string
                          critical:
                            type: boolean
                          latency_ms:
                            type: number
                            format: float
                        required:
                        - status
                        - critical
                        - latency_ms
                    required:
                    - database
                    - cache
                    - rate_limiter
                  latest_commit:
                    type: string
                required:
                - status
                - checked_at
                - subsystems
              example:
                status: unavailable
                checked_at: '2026-08-31T20:51:38Z'
                subsystems:
                  database:
                    status: error
                    critical: true
                    error: PG::ConnectionBad
                  cache:
                    status: ok
                    critical: false
                    latency_ms: 0.26
                  rate_limiter:
                    status: ok
                    critical: false
                    latency_ms: 0.14
                latest_commit: 538b30d6e2
  "/up":
    get:
      summary: show
      tags:
      - Rails::Health
      responses:
        '200':
          description: does not apply to non-API paths
          content:
            text/html:
              schema:
                type: string
              example: '<!DOCTYPE html><html><body style="background-color: green"></body></html>'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token returned by POST /api/v1/users or POST /api/v1/session
